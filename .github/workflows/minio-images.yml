# Builds the MinIO server and mc client from the official public source and
# publishes them to GHCR. The official images can no longer be pulled
# anonymously; see images/minio/README.md.
name: MinIO images

on:
  # Branches only: a pushed git tag (a Temps release) carries the same
  # images/minio/ and would queue behind main in the same concurrency group,
  # which makes GitHub cancel the run waiting there.
  push:
    branches: ['**']
    paths:
      - images/minio/**
      - .github/workflows/minio-images.yml
  workflow_dispatch:

permissions:
  contents: read

# Only main publishes, so main runs one at a time: two of them must never race
# to publish the same tag. Other refs build and smoke-test only and get a
# group per ref, so they never wait on (or displace) a pending main run.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'minio-images-main' || format('minio-images-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  images:
    name: MinIO and mc images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read pinned releases
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          dockerfile=images/minio/Dockerfile
          minio_release=$(sed -n 's/^ARG MINIO_RELEASE=//p' "$dockerfile")
          mc_release=$(sed -n 's/^ARG MC_RELEASE=//p' "$dockerfile")
          for release in "$minio_release" "$mc_release"; do
            if [[ ! "$release" =~ ^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]]; then
              echo "Unexpected release name in $dockerfile: '$release'" >&2
              exit 1
            fi
          done
          owner=${OWNER,,}
          {
            echo "minio_image=ghcr.io/$owner/minio:$minio_release"
            echo "mc_image=ghcr.io/$owner/mc:$mc_release"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false

      - name: Load amd64 minio image for the smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/minio
          target: minio
          platforms: linux/amd64
          load: true
          push: false
          tags: temps-minio:check

      - name: Load amd64 mc image for the smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/minio
          target: mc
          platforms: linux/amd64
          load: true
          push: false
          tags: temps-mc:check

      - name: Smoke test (bucket, put, get)
        run: |
          set -euo pipefail
          docker network create minio-smoke
          trap 'docker logs minio-smoke-server || true; docker rm -f minio-smoke-server >/dev/null 2>&1 || true; docker network rm minio-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name minio-smoke-server --network minio-smoke \
            -e MINIO_ROOT_USER=smokeadmin -e MINIO_ROOT_PASSWORD=smokeadmin \
            temps-minio:check server /data --console-address :9001
          # The bundled mc backs the healthcheck Temps configures for the S3 service.
          timeout 60 bash -c 'until docker exec minio-smoke-server mc ready local >/dev/null 2>&1; do sleep 1; done'
          docker exec minio-smoke-server minio --version
          docker run --rm --network minio-smoke --entrypoint /bin/sh \
            -e MC_HOST_smoke=http://smokeadmin:smokeadmin@minio-smoke-server:9000 \
            temps-mc:check -c '
              set -eu
              mc --version
              mc mb smoke/temps-smoke
              echo "temps minio smoke" > /tmp/object.txt
              mc cp /tmp/object.txt smoke/temps-smoke/object.txt
              test "$(mc cat smoke/temps-smoke/object.txt)" = "temps minio smoke"
            '

      # Only main publishes. Other branches stop after the multi-arch build
      # below, which still proves that both architectures compile.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags are immutable: a tag that already exists is never pushed
      # again, and that is not an error (the merge to main must not fail
      # because the tag was published before).
      - name: Decide what to publish
        id: publish
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          MINIO_IMAGE: ${{ steps.meta.outputs.minio_image }}
          MC_IMAGE: ${{ steps.meta.outputs.mc_image }}
        run: |
          set -euo pipefail
          for kind in minio mc; do
            if [[ "$kind" == minio ]]; then image=$MINIO_IMAGE; else image=$MC_IMAGE; fi
            publish=false
            existing=""
            if [[ "$IS_MAIN" == "true" ]]; then
              if existing=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' 2>/tmp/inspect.err); then
                existing=${existing//\"/}
              elif grep -q 'not found' /tmp/inspect.err; then
                existing=""
                publish=true
              else
                # Any other failure (network, auth) must not be mistaken for
                # a missing tag, or an existing tag could be overwritten.
                cat /tmp/inspect.err >&2
                exit 1
              fi
            fi
            {
              echo "${kind}_publish=$publish"
              echo "${kind}_existing=$existing"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Build (and publish on main) minio image
        id: minio
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/minio
          target: minio
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.minio_publish == 'true' }}
          tags: ${{ steps.meta.outputs.minio_image }}

      - name: Build (and publish on main) mc image
        id: mc
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/minio
          target: mc
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.mc_publish == 'true' }}
          tags: ${{ steps.meta.outputs.mc_image }}

      - name: Record digests
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          MINIO_IMAGE: ${{ steps.meta.outputs.minio_image }}
          MINIO_PUBLISH: ${{ steps.publish.outputs.minio_publish }}
          MINIO_EXISTING: ${{ steps.publish.outputs.minio_existing }}
          MINIO_DIGEST: ${{ steps.minio.outputs.digest }}
          MC_IMAGE: ${{ steps.meta.outputs.mc_image }}
          MC_PUBLISH: ${{ steps.publish.outputs.mc_publish }}
          MC_EXISTING: ${{ steps.publish.outputs.mc_existing }}
          MC_DIGEST: ${{ steps.mc.outputs.digest }}
        run: |
          set -euo pipefail
          row() {
            local image=$1 publish=$2 existing=$3 digest=$4
            if [[ "$publish" == "true" ]]; then
              echo "| \`$image\` | published | \`$digest\` |"
            elif [[ -n "$existing" ]]; then
              echo "| \`$image\` | :warning: tag already published, push skipped | \`$existing\` |"
            else
              echo "| \`$image\` | built only (not main) | \`$digest\` |"
            fi
          }
          {
            echo "### MinIO images"
            echo
            echo "| Image | Result | Digest |"
            echo "|---|---|---|"
            row "$MINIO_IMAGE" "$MINIO_PUBLISH" "$MINIO_EXISTING" "$MINIO_DIGEST"
            row "$MC_IMAGE" "$MC_PUBLISH" "$MC_EXISTING" "$MC_DIGEST"
            if [[ "$IS_MAIN" != "true" ]]; then
              echo
              echo "Only \`main\` publishes; this branch built and smoke-tested the images."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for existing in "$MINIO_EXISTING" "$MC_EXISTING"; do
            if [[ -n "$existing" ]]; then
              echo "::warning::A release tag was already published; its push was skipped (tags are immutable)."
            fi
          done
